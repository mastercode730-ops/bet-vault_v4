<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="50%" stop-color="#1A1200"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F5D073"/>
      <stop offset="100%" stop-color="#A68B2A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="420" cy="190" r="260" fill="url(#glow)"/>

  <!-- Pitch lines -->
  <rect x="0" y="330" width="800" height="2" fill="#D4AF37" opacity="0.15"/>
  <circle cx="400" cy="330" r="70" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.15"/>
  <rect x="60" y="300" width="140" height="60" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.15"/>

  <!-- Goal posts -->
  <g opacity="0.9" stroke="#5a5a5a" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M 560 320 L 560 190 L 700 190 L 700 320" />
    <path d="M 560 190 L 590 200 M 590 190 L 615 202 M 615 190 L 640 204 M 640 190 L 665 206 M 665 190 L 690 208" opacity="0.35" stroke-width="1.5"/>
  </g>

  <!-- Football -->
  <g transform="translate(330,210)">
    <circle cx="0" cy="0" r="58" fill="#EDEDED"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#111" stroke-width="2" opacity="0.5"/>
    <polygon points="0,-24 22,-8 14,18 -14,18 -22,-8" fill="#111"/>
    <path d="M0 -24 L0 -58 M22 -8 L54 -18 M14 18 L36 50 M-14 18 L-36 50 M-22 -8 L-54 -18" stroke="#111" stroke-width="2.5" opacity="0.55"/>
  </g>

  <!-- Motion arcs -->
  <path d="M 260 150 Q 200 180, 240 230" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <path d="M 245 135 Q 165 175, 220 250" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.25" stroke-linecap="round"/>

  <!-- Trophy icon top-left -->
  <g transform="translate(70,60)" opacity="0.85">
    <path d="M0 0 h34 v10 a17 17 0 0 1 -34 0 z" fill="url(#gold)"/>
    <rect x="13" y="10" width="8" height="16" fill="url(#gold)"/>
    <rect x="4" y="26" width="26" height="6" rx="2" fill="url(#gold)"/>
  </g>

  <text x="70" y="400" font-family="Montserrat, sans-serif" font-weight="900" font-size="26" fill="#D4AF37" opacity="0.85">Football</text>
  <text x="70" y="424" font-family="sans-serif" font-size="14" fill="#9CA3AF">Markets &amp; Betting Basics</text>
</svg>
