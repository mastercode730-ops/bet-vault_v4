<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="50%" stop-color="#1A1200"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F5D073"/>
      <stop offset="100%" stop-color="#A68B2A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="400" cy="200" r="260" fill="url(#glow)"/>

  <!-- Stumps -->
  <g opacity="0.9">
    <rect x="330" y="150" width="10" height="150" rx="3" fill="#3a3a3a"/>
    <rect x="395" y="150" width="10" height="150" rx="3" fill="#3a3a3a"/>
    <rect x="460" y="150" width="10" height="150" rx="3" fill="#3a3a3a"/>
    <rect x="322" y="140" width="26" height="8" rx="3" fill="#4a4a4a"/>
    <rect x="387" y="140" width="26" height="8" rx="3" fill="#4a4a4a"/>
  </g>

  <!-- Ground line -->
  <rect x="0" y="330" width="800" height="2" fill="#D4AF37" opacity="0.15"/>

  <!-- Cricket bat -->
  <g transform="translate(230,120) rotate(-25)">
    <rect x="0" y="0" width="26" height="150" rx="10" fill="url(#gold)"/>
    <rect x="7" y="150" width="12" height="90" rx="5" fill="#2a2a2a"/>
    <rect x="7" y="150" width="12" height="18" rx="4" fill="#1a1a1a"/>
  </g>

  <!-- Cricket ball -->
  <g transform="translate(470,190)">
    <circle cx="0" cy="0" r="34" fill="#7A1E1E"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#F5D073" stroke-width="1.5" opacity="0.5"/>
    <path d="M -30 -8 Q 0 10, 30 -8" fill="none" stroke="#F5D073" stroke-width="2" opacity="0.7"/>
    <path d="M -30 8 Q 0 26, 30 8" fill="none" stroke="#F5D073" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Motion arcs -->
  <path d="M 500 140 Q 560 170, 520 220" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  <path d="M 520 130 Q 590 165, 540 235" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.25" stroke-linecap="round"/>

  <!-- Trophy icon top-left -->
  <g transform="translate(70,60)" opacity="0.85">
    <path d="M0 0 h34 v10 a17 17 0 0 1 -34 0 z" fill="url(#gold)"/>
    <rect x="13" y="10" width="8" height="16" fill="url(#gold)"/>
    <rect x="4" y="26" width="26" height="6" rx="2" fill="url(#gold)"/>
  </g>

  <text x="70" y="400" font-family="Montserrat, sans-serif" font-weight="900" font-size="26" fill="#D4AF37" opacity="0.85">IPL 2026</text>
  <text x="70" y="424" font-family="sans-serif" font-size="14" fill="#9CA3AF">Strategy &amp; Insights</text>
</svg>
